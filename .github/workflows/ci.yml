name: CI

on:
  push:
  pull_request:

# The Django project lives in ./minishop, not at the repo root.
defaults:
  run:
    working-directory: minishop

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: minishop
          POSTGRES_USER: minishop
          POSTGRES_PASSWORD: minishop
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U minishop"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://minishop:minishop@localhost:5432/minishop
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: minishop/uv.lock
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run python manage.py makemigrations --check --dry-run
        env:
          DJANGO_SECRET_KEY: ci
      - run: uv run pytest --cov --cov-report=term-missing

{% extends "base.html" %}
{% block title %}Log in · MiniShop{% endblock %}
{% block content %}
<h1>Log in</h1>
<form method="post" class="form">
  {% csrf_token %}
  {{ form.as_p }}
  <button class="btn">Log in</button>
</form>
<p>No account? <a href="{% url 'signup' %}">Sign up</a></p>
{% endblock %}
